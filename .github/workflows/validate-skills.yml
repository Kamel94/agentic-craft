name: Validate Agent Skills

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show GitHub CLI version
        run: gh --version

      - name: Validate Agent Skills
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run
